<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Registro de Mascotas</title>
    <link rel="stylesheet" href="css/mascotas.css">

</head>

<body>

    <div class="formulario">

        <h1>Registro de Mascotas</h1>
        <img src="img/mascotas.jpg" alt="Foto de una mascota" class="imagen-mascota">

        <form id="formMascota">

            <label for="nombreMascota">Nombre de la mascota:</label>
            <input type="text" id="nombreMascota" required>

            <label for="especie">Especie:</label>
            <input type="text" id="especie" placeholder="Perro, gato, etc." required>

            <label for="edadMascota">Edad (años):</label>
            <input type="number" id="edadMascota" required>

            <button type="submit">Registrar</button>

        </form>

        <p id="resultado"></p>

    </div>

    <script src="js/scriptsmascota.js"></script>

</body>
</html>
